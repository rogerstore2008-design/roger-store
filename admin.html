<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نص كبير</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212; /* لون خلفية داكن */
            font-family: 'Cairo', Arial, sans-serif;
        }

        .huge-text {
            font-size: 20vw; /* حجم الخط يتكيف ويكون ضخماً جداً بناءً على عرض الشاشة */
            font-weight: 900;
            color: #D4AF37; /* لون ذهبي */
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="huge-text">يافقي</div>

</body>
</html>
